services:
  pumpbot:
    build:
      context: .
      args:
        FEATURES: ""          # "capture", "grpc", "capture,grpc"
        PROFILE: release      # release-fast per iterare
    image: kraken/pumpbot:dev
    container_name: pumpbot
    restart: unless-stopped
    user: "1000:1000"         # scrive su ./data di kraken (distroless nonroot sarebbe 65532)
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: .env            # HELIUS_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID  (chmod 600)
    environment:
      TZ: Europe/Rome
    volumes:
      - ./config:/config:ro
      - ./data:/data
    mem_limit: 256m
    cpus: 2.0
    stop_grace_period: 15s    # SIGTERM -> flush batch SQLite + chiusura posizioni paper su disco
